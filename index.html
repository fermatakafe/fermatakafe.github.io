const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const num = n => n ? Number(n).toLocaleString("tr-TR") : "—";
const q = new URLSearchParams(location.search);
let lang = (q.get("lang") || navigator.language || "tr").slice(0, 2) === "en" ? "en" : "tr";
const T = { title: { tr: "Fermata — Menü", en: "Fermata — Menu" }, nav: { tr: "Menü bölümleri", en: "Menu sections" }, close: { tr: "Kapat", en: "Close" } };
const flat = [];

function priceHtml(i, sec){
  const p = i.price;
  if (p == null) return "";
  if (Array.isArray(p)) {
    const z = (i.sizes || sec.sizes)[lang];
    return `<span class="price"><span class="pl">${esc(z[0])}</span>${num(p[0])}<span class="gap"></span><span class="pl">${esc(z[1])}</span>${num(p[1])}</span>`;
  }
  return `<span class="price">${num(p)}</span>`;
}

function render(){
  document.documentElement.lang = lang;
  document.title = T.title[lang];
  document.querySelector("nav").setAttribute("aria-label", T.nav[lang]);
  document.querySelector("dialog .close").setAttribute("aria-label", T.close[lang]);
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = MENU.text[el.dataset.t][lang]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.getElementById("chips").innerHTML = MENU.sections.map(s => `<a href="#${s.id}">${esc(s.name[lang])}</a>`).join("");
  flat.length = 0;
  document.getElementById("menu").innerHTML = MENU.sections.map(s => `
    <section id="${s.id}">
      <h2 class="cat"><span>${esc(s.name[lang])}</span></h2>
      <div class="items${s.compact ? " compact" : ""}">${s.items.map(i => {
        const k = flat.push({ i, s }) - 1;
        const line = i.note || (i.line ? i.line[lang] : "");
        const sub = line ? `<span class="sub">${esc(line)}</span>` : "";
        const name = `<span class="name">${esc(i.name[lang])}</span>`;
        const src = i.feature ? `img/${esc(i.img)}` : `img/thumb/${esc(i.img)}`;
        const pic = i.img ? `<button class="pic" type="button" data-k="${k}" aria-label="${esc(i.name[lang])}"><img src="${src}" alt="" loading="lazy" width="148" height="148" onerror="this.parentNode.remove()"></button>` : "";
        if (s.compact) return `<div class="item"><div class="txt">${name}${sub}</div>${priceHtml(i, s)}</div>`;
        if (i.feature) return `<div class="item feature">${pic}<div class="txt">${name}${sub}${priceHtml(i, s)}</div></div>`;
        return `<div class="item"><div class="txt">${name}${sub}${priceHtml(i, s)}</div>${pic}</div>`;
      }).join("")}</div>
    </section>`).join("");
  spy();
}

const dlg = document.getElementById("photo");
document.getElementById("menu").addEventListener("click", e => {
  const b = e.target.closest("button.pic"); if (!b) return;
  const { i, s } = flat[+b.dataset.k];
  const img = document.getElementById("ph-img");
  img.src = "img/" + i.img; img.alt = i.name[lang];
  document.getElementById("ph-name").textContent = i.name[lang];
  document.getElementById("ph-sub").textContent = i.line ? i.line[lang] : "";
  document.getElementById("ph-price").innerHTML = priceHtml(i, s).replace(/^<span class="price">|<\/span>$/g, "");
  dlg.showModal();
});
dlg.querySelector(".close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.l; render();
  try { const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u); } catch (e) {}
}));

let io;
function spy(){
  if (io) io.disconnect();
  const chips = [...document.querySelectorAll("#chips a")];
  const row = document.getElementById("chips");
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    chips.forEach(c => {
      const on = c.getAttribute("href") === "#" + e.target.id;
      if (on === c.classList.contains("on")) return;
      c.classList.toggle("on", on);
      // slide only the chip row sideways; scrollIntoView here also moved the page and fought the visitor's scrolling
      if (on) row.scrollTo({ left: c.offsetLeft - (row.clientWidth - c.offsetWidth) / 2, behavior: "smooth" });
    });
  }), { rootMargin: "-70px 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => io.observe(s));
}
render();
</script>
