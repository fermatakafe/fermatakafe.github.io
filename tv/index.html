<!doctype html>
<!--
  FERMATA TV — v2
  Café TV page: YouTube channels in a liquid-glass player, plus Fermata's own ambient channels.
  Everything is controlled from playlist.json (same folder). See CLAUDE.md for the full spec.

  REMOTE
  OK        play / pause            ← →   previous / next video or track
  ↑         channel menu            ↓     show / hide the player dock
  CH+ CH−   next / previous channel  ▶ ❚❚ ⏭ ⏮ media keys work too
  INFO      shows the real screen resolution and YouTube quality
  TV volume buttons = volume
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fermata TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* ── Fermata brand tokens (Brand Book 0.2, p.11) ─────────────────────── */
  :root{
    --cream:#F5F0E6; --graphite:#3B3A36; --pistachio:#D9DEB4; --gold:#C7A267;
    --bronze:#A8834B; --warm-grey:#9A8F7E; --rule:#DDD2BC;
    --ground:#1F1E1B;                       /* graphite, deepened for a screen */
    --ink:var(--cream); --muted:rgba(245,240,230,.62);
    --c1:#C7A267; --c2:#D9DEB4; --c3:#3B3A36;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:Jost,system-ui,sans-serif;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{cursor:none} body.pointer{cursor:default}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
    background:#1F1E1B;background:var(--ground);color:#F5F0E6;color:var(--ink);font-family:Jost,sans-serif;font-family:var(--sans);font-weight:400}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ── Liquid glass ─────────────────────────────────────────────────────── */
  .glass{
    position:relative;isolation:isolate;
    background:linear-gradient(140deg,rgba(245,240,230,.20) 0%,rgba(245,240,230,.07) 45%,rgba(59,58,54,.22) 100%);
    -webkit-backdrop-filter:blur(34px) saturate(175%) brightness(1.04);
            backdrop-filter:blur(34px) saturate(175%) brightness(1.04);
    border:1px solid rgba(255,255,255,.24);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.50),          /* top specular rim */
      inset 0 -1px 0 rgba(255,255,255,.10),
      inset 1px 0 0 rgba(255,255,255,.12),
      inset 0 0 32px rgba(245,240,230,.07),           /* inner glow */
      0 30px 80px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.18);
  }
  .glass::before{ /* curved highlight sweeping across the top */
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;z-index:-1;
    background:radial-gradient(130% 70% at 18% -10%,rgba(255,255,255,.30),rgba(255,255,255,0) 55%),
               radial-gradient(90% 60% at 100% 120%,rgba(199,162,103,.16),rgba(199,162,103,0) 60%);
  }
  .glass::after{ /* thin refracted edge */
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;pointer-events:none;
    padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(199,162,103,.45));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  body.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(40,39,36,.80)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{background:rgba(40,39,36,.80)}
  }

  /* ── Background layers ────────────────────────────────────────────────── */
  #visual{position:absolute;top:0;right:0;bottom:0;left:0;transition:opacity 1.2s}
  #visual.off{opacity:0}
  .blob{position:absolute;width:1300px;height:1300px;border-radius:50%;opacity:.42;will-change:transform}
  .b1{left:-300px;top:-420px;background:radial-gradient(circle,var(--c1) 0%,transparent 63%);animation:d1 43s ease-in-out infinite alternate}
  .b2{right:-340px;top:-140px;background:radial-gradient(circle,var(--c2) 0%,transparent 63%);animation:d2 55s ease-in-out infinite alternate}
  .b3{left:380px;bottom:-620px;background:radial-gradient(circle,var(--c3) 0%,transparent 63%);animation:d3 49s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(540px,320px) scale(1.18)}}
  @keyframes d2{to{transform:translate(-500px,280px) scale(.9)}}
  @keyframes d3{to{transform:translate(-320px,-300px) scale(1.12)}}
  #vid{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s}
  #vid.on{opacity:1}
  /* sized to real screen pixels by fit(), so a 4K screen gets a 4K player and YouTube streams 2160p */
  #ytWrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;opacity:0;transition:opacity 1.2s;pointer-events:none;background:#000}
  #ytWrap.on{opacity:1}
  #ytWrap iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
  .veil{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,9,8,.55) 0%,rgba(10,9,8,0) 22%,rgba(10,9,8,0) 62%,rgba(10,9,8,.55) 100%)}

  /* ── Overlay ──────────────────────────────────────────────────────────── */
  #ui{position:absolute;top:0;right:0;bottom:0;left:0;transition:transform 6s ease,opacity .45s,filter .45s}
  #ui.dim{opacity:.18;filter:blur(2px)}
  #dock.noprog .progRow{display:none}
  .swap{transition:opacity .8s}
  .swap.out{opacity:0}
  /* no CSS filter here: Samsung TVs draw video on a hardware plane and drop filtered layers behind it */
  .logo{position:absolute;left:96px;top:70px;height:96px}
  .logoText{position:absolute;left:96px;top:78px;font-family:var(--serif);font-size:64px;letter-spacing:.3em;font-weight:500}

  .clockPill{position:absolute;right:96px;top:72px;height:84px;border-radius:42px;padding:0 36px;display:flex;align-items:center}
  #clock{font-size:46px;font-weight:300;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .clockPill .sep{width:1px;height:34px;background:rgba(245,240,230,.3)}
  .clockPill .hours{font-size:21px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

  .card{position:absolute;border-radius:36px}
  .label{font-size:18px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}

  /* menu card: today's special + dishes from the online menu, the photo floats out of the glass */
  #menuCard{right:96px;bottom:432px;width:860px;min-height:332px;padding:36px 42px 36px 418px;box-sizing:border-box;transition:opacity 1s,transform 1s}
  #menuCard.hide{opacity:0;transform:translateY(16px)}
  #menuCard.noimg{width:560px;min-height:0;padding-left:42px}
  #menuCard.noimg .mcPhoto{display:none}
  /* dish photo on its own cream ground (cropped from the WhatsApp dish cards): no cut-out edges */
  .mcPhoto{position:absolute;left:30px;top:50%;width:350px;height:285px;margin-top:-142px;border-radius:26px;overflow:hidden;background:var(--cream);
    box-shadow:0 18px 44px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.35);transition:opacity .7s,transform .7s}
  .mcPhoto.out{opacity:0;transform:scale(.96)}
  .mcPhoto img{width:100%;height:100%;object-fit:cover;display:block;animation:drift 9s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.05)}}
  #mcName{font-family:var(--serif);font-size:52px;line-height:1.04;margin-top:12px}
  #mcLine{font-size:21px;line-height:1.42;color:var(--muted);margin-top:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #mcLine:empty{display:none}
  #mcPrice{margin-top:16px;font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #mcPrice:empty{display:none}
  #mcPrice .pl{font-size:15px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-right:10px}
  #mcPrice .gap{display:inline-block;width:30px}
  #mcPrice .tl{font-size:17px;letter-spacing:.16em;color:var(--muted);margin-left:8px}

  #qrCard{right:96px;bottom:72px;width:300px;padding:26px 26px 22px;text-align:center}
  .qrs{position:relative;width:248px;height:248px;margin:0 auto}
  .qrItem{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--cream);border-radius:22px;padding:18px;box-sizing:border-box;opacity:0;transition:opacity 1s;line-height:0}
  .qrItem.on{opacity:1}
  .qrItem img,.qrItem canvas{width:212px!important;height:212px!important;display:block}
  #qrCap{margin-top:16px;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

  /* ── Player dock ──────────────────────────────────────────────────────── */
  #dock{position:absolute;left:96px;bottom:72px;width:620px;border-radius:40px;padding:18px;box-sizing:border-box;
    transition:width .55s cubic-bezier(.2,.8,.2,1),padding .55s,border-radius .55s}
  #dock.expanded{width:1160px;padding:26px 30px 24px}
  .dRow{display:flex;align-items:center}
  .thumb{flex:none;width:128px;height:72px;border-radius:18px;overflow:hidden;background:var(--graphite);
    display:flex;align-items:center;justify-content:center;transition:width .55s,height .55s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #dock.expanded .thumb{width:224px;height:126px;border-radius:22px}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb img.picto{width:58%;height:auto;object-fit:contain}
  .meta{flex:1;min-width:0}
  .chipRow{display:flex;align-items:center;margin-bottom:6px}
  .eq{display:flex;align-items:flex-end;height:18px}
  .eq i{display:block;width:4px;background:var(--gold);border-radius:2px;height:6px;animation:eq 1.1s ease-in-out infinite alternate}
  .eq i:nth-child(2){animation-delay:.3s}.eq i:nth-child(3){animation-delay:.6s}.eq i:nth-child(4){animation-delay:.15s}
  @keyframes eq{to{height:18px}}
  .stopped .eq i{animation:none;height:5px}
  #chip{font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  #chip.auto::after{content:"  ·  AUTO";color:var(--muted)}
  #title{font-family:var(--serif);font-size:32px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .55s}
  #dock.expanded #title{font-size:44px}
  #author{font-size:19px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrls{display:flex;align-items:center;flex:none;opacity:0;max-width:0;overflow:hidden;transition:opacity .4s,max-width .55s}
  #dock.expanded .ctrls{opacity:1;max-width:320px}
  .cbtn{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .cbtn.big{width:96px;height:96px;background:rgba(245,240,230,.92);color:var(--graphite);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .cbtn svg{width:30px;height:30px;fill:currentColor}
  .cbtn.big svg{width:38px;height:38px}
  .cbtn.focus{box-shadow:0 0 0 4px var(--gold),0 10px 30px rgba(0,0,0,.3)}
  .progRow{display:flex;align-items:center;max-height:0;opacity:0;overflow:hidden;transition:max-height .55s,opacity .4s,margin .55s}
  #dock.expanded .progRow{max-height:40px;opacity:1;margin-top:22px}
  .prog{flex:1;height:6px;border-radius:3px;background:rgba(245,240,230,.22);overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,var(--bronze),var(--gold));border-radius:3px;transition:width .5s linear}
  .times{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em;white-space:nowrap}
  .live{color:var(--gold);letter-spacing:.2em}

  #queue{position:absolute;left:96px;bottom:322px;display:flex;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;pointer-events:none}
  #queue.show{opacity:1;transform:none}
  .qItem{width:200px;border-radius:24px;padding:10px;box-sizing:border-box}
  .qItem .qi{width:180px;height:101px;border-radius:16px;overflow:hidden;background:var(--graphite)}
  .qItem .qi img{width:100%;height:100%;object-fit:cover;display:block}
  .qItem .qt{font-size:15px;margin:10px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  .qItem.cur{box-shadow:0 0 0 2px var(--gold),0 20px 50px rgba(0,0,0,.35)}
  .qItem.cur .qt{color:var(--gold)}

  /* ── Channel menu ─────────────────────────────────────────────────────── */
  #menu{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:rgba(15,14,12,.35);
    opacity:0;pointer-events:none;transition:opacity .45s}
  #menu.open{opacity:1;pointer-events:auto}
  .sheet{border-radius:48px;padding:56px 64px 48px;text-align:center;transform:scale(.97);transition:transform .45s}
  #menu.open .sheet{transform:none}
  .sheet h2{font-family:var(--serif);font-weight:500;font-size:54px;letter-spacing:.18em;margin:0 0 44px}
  .tiles{display:flex}
  .tile{width:240px;height:210px;border-radius:30px;padding:26px;box-sizing:border-box;text-align:left;
    display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s,box-shadow .25s;cursor:pointer}
  .tile .dot{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,var(--t1),var(--t2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .tile .tn{font-family:var(--serif);font-size:34px;line-height:1.05}
  .tile .th{font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .tile.focus{transform:scale(1.07);box-shadow:0 0 0 3px var(--gold),0 30px 70px rgba(0,0,0,.45)}
  .tile.current .tn::after{content:"  ●";color:var(--gold);font-size:20px;vertical-align:middle}
  .keys{margin-top:40px;font-size:18px;color:var(--muted);letter-spacing:.1em}

  /* ── Messages ─────────────────────────────────────────────────────────── */
  .msg{position:absolute;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .5s;white-space:nowrap;pointer-events:none}
  .msg.show{opacity:1}
  #toast{top:72px;height:84px;border-radius:42px;padding:0 40px;display:flex;align-items:center;font-family:var(--serif);font-size:38px}
  #hint{top:190px;border-radius:999px;padding:18px 36px;background:var(--gold);color:var(--graphite);font-size:24px;font-weight:500;letter-spacing:.06em;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  #paused{top:50%;margin-top:-90px;border-radius:44px;padding:36px 64px;text-align:center}
  #stage.overlaid #paused, #stage.overlaid #hint{opacity:0}   /* never on top of an open menu or library */
  #paused .pt{font-family:var(--serif);font-size:56px}
  #paused small{display:block;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:10px}

  /* ── Music library & search ──────────────────────────────────────────── */
  #lib{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(15,14,12,.55);opacity:0;pointer-events:none;transition:opacity .4s}
  #lib.open{opacity:1;pointer-events:auto}
  .libSheet{position:absolute;left:120px;top:56px;width:1680px;height:968px;border-radius:48px;overflow:hidden}
  .libHead{position:absolute;left:60px;right:60px;top:44px;height:70px}
  .libHead h2{position:absolute;left:0;top:0;margin:0;font-family:var(--serif);font-weight:500;font-size:52px;letter-spacing:.14em}
  .libKeys{position:absolute;right:0;top:22px;font-size:18px;color:var(--muted);letter-spacing:.1em}
  .cats{position:absolute;left:44px;top:150px;width:310px;bottom:48px}
  .cat{height:64px;line-height:64px;padding:0 22px;border-radius:32px;margin-bottom:10px;font-size:19px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat.sel{color:var(--ink);background:rgba(245,240,230,.10)}
  .cat.focus{box-shadow:0 0 0 3px var(--gold);color:var(--ink)}
  .libMain{position:absolute;left:392px;width:1228px;top:150px;bottom:40px;overflow:hidden}
  .libGrid{position:absolute;left:0;top:6px;width:1228px;display:flex;flex-wrap:wrap;transition:transform .35s}
  .card2{width:292px;height:230px;margin:0 20px 16px 0;padding:10px;box-sizing:border-box;border-radius:24px;transition:transform .2s,box-shadow .2s,background .2s}
  .card2:nth-child(4n){margin-right:0}
  .card2.focus{transform:scale(1.03);background:rgba(245,240,230,.10);box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.4)}
  .card2 .th{position:relative;height:153px;border-radius:16px;overflow:hidden;background:var(--graphite)}
  .card2 .th img{width:100%;height:100%;object-fit:cover;display:block}
  .card2 .th.kbd{font-size:72px;line-height:153px;text-align:center;color:var(--muted)}
  .card2 .badge{position:absolute;right:8px;bottom:8px;padding:3px 10px;border-radius:10px;background:rgba(31,30,27,.8);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  .card2 .tt{margin:10px 4px 0;font-size:17px;line-height:1.3;max-height:44px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card2.now .tt{color:var(--gold)}
  .libEmpty{padding:40px 10px;font-size:24px;letter-spacing:.1em;color:var(--muted)}
  .kbInput{height:88px;line-height:88px;border-radius:44px;padding:0 40px;margin:6px 0 34px;font-size:36px;background:rgba(245,240,230,.10);white-space:nowrap;overflow:hidden}
  .kbInput .muted{color:var(--muted)}
  .caret{display:inline-block;width:3px;height:42px;margin-left:4px;vertical-align:middle;background:var(--gold);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .kRow{display:flex;margin-bottom:12px}
  .key{width:104px;height:76px;line-height:76px;margin-right:12px;border-radius:20px;text-align:center;font-size:28px;background:rgba(245,240,230,.08)}
  .key.wide{width:336px;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
  .key.mid{width:220px}
  .key.go{background:rgba(245,240,230,.9);color:var(--graphite);font-size:22px;letter-spacing:.16em;text-transform:uppercase}
  .key.focus{box-shadow:0 0 0 3px var(--gold);background:rgba(245,240,230,.24)}
  .key.go.focus{background:var(--cream)}

  /* spacing in flex rows: margins, not "gap" (flex gap needs Chrome 84; older Samsung TVs ignore it) */
  .clockPill>*+*{margin-left:26px} .dRow>*+*{margin-left:24px} .chipRow>*+*{margin-left:14px} .eq>*+*{margin-left:4px}
  .ctrls>*+*{margin-left:16px} .progRow>*+*{margin-left:18px} #queue>*+*{margin-left:18px} .tiles>*+*{margin-left:28px}
</style>
</head>
<body>
<div id="stage">
  <div id="visual">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <video id="vid" muted playsinline></video>
  </div>
  <div id="ytWrap"><div id="yt"></div></div>
  <div class="veil"></div>

  <div id="ui">
    <img class="logo" src="assets/fermata-logo-cream-gold.svg" alt="Fermata"
         onerror="this.outerHTML='<div class=&quot;logoText&quot;>FERMATA</div>'">

    <div class="clockPill glass">
      <span id="clock">--:--</span><span class="sep"></span>
      <span class="hours swap"><span data-i18n="daily"></span> <span id="hours"></span></span>
    </div>

    <div id="menuCard" class="card glass hide noimg">
      <div class="mcPhoto" id="mcPhoto"></div>
      <div class="swap" id="mcText">
        <div class="label" id="mcLabel"></div>
        <div id="mcName"></div>
        <div id="mcLine"></div>
        <div id="mcPrice"></div>
      </div>
    </div>

    <div id="qrCard" class="card glass">
      <div class="qrs" id="qrs"></div>
      <div id="qrCap" class="swap"></div>
    </div>

    <div id="queue"></div>

    <div id="dock" class="glass">
      <div class="dRow">
        <div class="thumb" id="thumb"></div>
        <div class="meta">
          <div class="chipRow"><div class="eq"><i></i><i></i><i></i><i></i></div><div id="chip" class="swap"></div></div>
          <div id="title"></div>
          <div id="author"></div>
        </div>
        <div class="ctrls">
          <button class="cbtn glass" data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
          <button class="cbtn big" data-act="play" aria-label="Play/Pause" id="playBtn"></button>
          <button class="cbtn glass" data-act="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
        </div>
      </div>
      <div class="progRow">
        <span class="times" id="cur">0:00</span>
        <div class="prog"><div id="fill"></div></div>
        <span class="times" id="dur"></span>
      </div>
    </div>
  </div>

  <div id="menu">
    <div class="sheet glass">
      <h2 class="swap" data-i18n="channels"></h2>

var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg>';

/* ════════════════ helpers & state ════════════════ */
function $(id){ return document.getElementById(id); }
function T(o){ return (o && (o[S.lang] || o.tr || o.en)) || ""; }
function CH(){ return CONFIG.channels; }
function chan(){ return S.pick || CH()[S.ch]; }   // a library pick stands in for the channel until the next block
function isYT(){ return chan().source === "youtube"; }
function pad(n){ return (n<10?"0":"")+n; }
function fmt(s){ s = Math.max(0, Math.floor(s||0)); var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+":"+pad(m) : m)+":"+pad(x); }
function hourLabel(c){ return c.hours ? pad(c.hours[0])+".00 – "+pad(c.hours[1]%24)+".00" : ""; }
function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function ytItems(c){ return ((c.youtube && c.youtube.videos) || []).map(function(v){ return typeof v === "string" ? {id:v} : v; }); }
function ytTitle(id){ var it = ytItems(chan()).filter(function(v){ return v.id === id; })[0]; return it && it.title; }
function ytThumb(id){ return "https://i.ytimg.com/vi/"+id+"/hqdefault.jpg"; }

var S = { ch:0, track:0, vid:0, playing:true, override:false, overrideBlock:-1, lang:"tr",
          menuOpen:false, focus:0, unlocked:false, mode:"synth", fails:0 };
var aud = new Audio(); aud.preload = "auto";
var vid = $("vid");

/* ════════════════ fit the 1920×1080 stage to any screen ════════════════ */
function fit(){
  var s = Math.min(innerWidth/1920, innerHeight/1080);
  $("stage").style.transform = "translate("+((innerWidth-1920*s)/2)+"px,"+((innerHeight-1080*s)/2)+"px) scale("+s+")";
  var y = $("ytWrap").style;   // undo the stage scale for the player only
  y.width = Math.round(1920*s)+"px"; y.height = Math.round(1080*s)+"px"; y.transform = "scale("+(1/s)+")";
}
addEventListener("resize", fit); fit();

/* ════════════════ built-in ambient music (Web Audio) ════════════════ */
var Synth = {
  ctx:null, master:null, bus:null, timer:null, step:0, p:null,
  init:function(){
    if (this.ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    var c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = 0; this.bus = c.createGain();
    var lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1900;
    var d = c.createDelay(1.5); d.delayTime.value = .42; var fb = c.createGain(); fb.gain.value = .38;
    this.bus.connect(lp); lp.connect(this.master); lp.connect(d); d.connect(fb); fb.connect(d); d.connect(this.master);
    this.master.connect(c.destination); return true;
  },
  start:function(p){
    if (!this.init()) return;
    clearInterval(this.timer); this.p = p; this.step = 0;
    var g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(CONFIG.volume, t+2.5);
    var self = this; this.tick(); this.timer = setInterval(function(){ self.tick(); }, p.bar*1000);
  },
  stop:function(){
    clearInterval(this.timer); this.timer = null; if (!this.ctx) return;
    var g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t+1.2);
  },
  note:function(f,t,dur,type,amp){
    var c = this.ctx, o = c.createOscillator(), g = c.createGain();

    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp,t+dur*.3); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+dur+.1);
  },
  tick:function(){
    var p = this.p, t = this.ctx.currentTime+.05, ch = p.chords[this.step % p.chords.length], i;
    for (i=0;i<ch.length;i++) this.note(p.root*Math.pow(2,ch[i]/12), t+i*p.strum, p.bar*1.15, p.wave, .045);
    this.note(p.root/2*Math.pow(2,ch[0]/12), t, p.bar*1.05, "sine", .08);
    for (i=0;i<(p.sparkle||0);i++){ var s = ch[Math.floor(Math.random()*ch.length)]+12; this.note(p.root*Math.pow(2,s/12), t+Math.random()*p.bar, 1.8, "triangle", .028); }
    this.step++;
  }
};

/* ════════════════ YouTube (IFrame Player API) ════════════════ */
var YTP = { player:null, ready:false, loading:false, cbs:[], errors:0, apTimer:null };
function loadYT(cb){
  if (window.YT && YT.Player){ cb(); return; }
  YTP.cbs.push(cb); if (YTP.loading) return; YTP.loading = true;
  window.onYouTubeIframeAPIReady = function(){ var f = YTP.cbs; YTP.cbs = []; f.forEach(function(x){ x(); }); };
  var s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function(){ toast(T(TXT.unavailable)); localFallback(); };
  document.head.appendChild(s);
}
function createPlayer(done){
  var pv = { autoplay:1, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, playsinline:1, rel:0, cc_load_policy:0,
             mute: CONFIG.tryUnmutedAutoplay ? 0 : 1 };
  if (location.protocol !== "file:") pv.origin = location.origin;
  YTP.player = new YT.Player("yt", { host:CONFIG.ytHost, width:"100%", height:"100%", playerVars:pv,
    events:{ onReady:function(){ YTP.ready = true; done(); }, onStateChange:onYTState, onError:onYTError } });
}
function startYouTube(){
  S.mode = "yt"; setLayers(true);
  loadYT(function(){ if (!YTP.player) createPlayer(cueChannel); else if (YTP.ready) cueChannel(); });
  updateNow(); renderQueue();
}
function cueChannel(){
  if (!isYT()) return;
  var y = chan().youtube || {}, p = YTP.player; YTP.errors = 0;
  if (y.playlist) p.loadPlaylist({ list:y.playlist, listType:"playlist", index:0 });
  else {
    var ids = ytItems(chan()).map(function(v){ return v.id; });
    if (!ids.length){ localFallback(); return; }
    p.loadPlaylist(ids, 0);
  }
  try { p.setLoop(true); } catch(e){}
  if (y.shuffle) setTimeout(function(){ try { p.setShuffle(true); p.playVideoAt(0); } catch(e){} }, 1500);
  if (S.unlocked){ p.unMute(); }
  p.setVolume(Math.round(CONFIG.volume*100));
  if (!S.playing) setTimeout(function(){ p.pauseVideo(); }, 900);
  checkAutoplay();
}
function checkAutoplay(){
  clearTimeout(YTP.apTimer);
  YTP.apTimer = setTimeout(function(){
    if (!isYT() || !S.playing || !YTP.ready) return;
    var p = YTP.player;
    if (p.getPlayerState() !== 1){ p.mute(); p.playVideo(); showHint(); }   // blocked with sound → run muted
    else if (p.isMuted()) showHint(); else setUnlocked();
  }, 3200);
}
function onYTState(e){
  if (!isYT()) return;
  if (e.data === 1){
    YTP.errors = 0; if (!S.playing) YTP.player.pauseVideo(); updateNow(); renderQueue();
    try { YTP.player.unloadModule("captions"); YTP.player.unloadModule("cc"); } catch(x){}   // some uploads force "[music]" captions on
  }
}
function onYTError(){
  if (!isYT()) return;
  YTP.errors++;
  var n = (YTP.player.getPlaylist() || []).length || 1;
  if (YTP.errors > n){ toast(T(TXT.unavailable)); localFallback(); return; }
  setTimeout(function(){ try { YTP.player.nextVideo(); } catch(e){} }, 900);   // not embeddable / removed → skip
}
function localFallback(){ // YouTube unreachable: keep the room sounding with the channel's ambient
  if (YTP.ready) try { YTP.player.stopVideo(); } catch(e){}
  setLayers(false); startVisual(); useSynth();
}
function setLayers(yt){ $("ytWrap").classList.toggle("on", yt); $("visual").classList.toggle("off", yt); }

/* ════════════════ local audio / video ════════════════ */
function startLocal(){
  setLayers(false); startVisual(); S.fails = 0;
  var c = chan();
  if (c.tracks && c.tracks.length){ S.mode = "file"; playTrack(); } else useSynth();
}
function useSynth(){
  S.mode = "synth"; aud.pause();
  if (S.playing) Synth.start(chan().synth || CH()[0].synth);
  updateNow(); renderQueue();
  setTimeout(function(){
    if (S.mode !== "synth" || !S.playing || !Synth.ctx) return;
    if (Synth.ctx.state === "running") setUnlocked(); else showHint();
  }, 400);
}
function playTrack(){
  var c = chan(), t = c.tracks[S.track % c.tracks.length];
  aud.src = t.src; aud.volume = CONFIG.volume; updateNow(); renderQueue();
  if (!S.playing) return;
  var pr = aud.play();
  if (pr && pr.then) pr.then(setUnlocked)["catch"](function(e){ if (e && e.name === "NotAllowedError") showHint(); });
}
aud.addEventListener("ended", function(){ step(1); });
aud.addEventListener("playing", function(){ S.fails = 0; });
aud.addEventListener("error", function(){
  if (S.mode !== "file") return;
  S.fails++; if (S.fails >= chan().tracks.length) useSynth(); else step(1);
});
function startVisual(){
  var v = chan().videos || [];
  if (v.length) playVid(); else { vid.classList.remove("on"); vid.removeAttribute("src"); try { vid.load(); } catch(e){} }
}
function playVid(){
  var v = chan().videos; vid.loop = v.length === 1; vid.src = v[S.vid % v.length];
  if (!S.playing) return;
  var pr = vid.play(); if (pr && pr["catch"]) pr["catch"](function(){});
}
vid.addEventListener("playing", function(){ vid.classList.add("on"); });
vid.addEventListener("ended", function(){ S.vid++; playVid(); });
vid.addEventListener("error", function(){ vid.classList.remove("on"); });

/* ════════════════ transport ════════════════ */
function stopAll(){
  clearTimeout(YTP.apTimer); Synth.stop(); aud.pause(); vid.pause();
  if (YTP.ready) try { YTP.player.stopVideo(); } catch(e){}
}
function step(dir){
  if (S.mode === "yt" && YTP.ready){ if (dir > 0) YTP.player.nextVideo(); else YTP.player.previousVideo(); return; }
  var n = (chan().tracks || []).length; if (S.mode !== "file" || !n) return;
  S.track = (S.track + dir + n) % n; playTrack();
}
function setPlaying(on){
  if (on === S.playing) return;
  S.playing = on;
  if (on){
    if (S.mode === "yt" && YTP.ready) YTP.player.playVideo();
    else if (S.mode === "file"){ var p = aud.play(); if (p && p["catch"]) p["catch"](function(){}); }
    else Synth.start(chan().synth || CH()[0].synth);
    if (S.mode !== "yt" && (chan().videos||[]).length){ var q = vid.play(); if (q && q["catch"]) q["catch"](function(){}); }
  } else {
    if (YTP.ready) try { YTP.player.pauseVideo(); } catch(e){}
    aud.pause(); Synth.stop(); vid.pause();
  }
  $("paused").classList.toggle("show", !on);
  $("dock").classList.toggle("stopped", !on);
  $("playBtn").innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  wakeDock();
}

/* ════════════════ channels & schedule ════════════════ */
function scheduledIndex(){
  var h = new Date().getHours(), list = CH();
  for (var i=0;i<list.length;i++){ var r = list[i].hours; if (r && h >= r[0] && h < r[1]) return i; }
  return list.length - 1;
}
function startChannel(i, manual){
  var n = CH().length; stopAll();
  S.pick = null; S.ch = ((i % n) + n) % n; S.track = 0; S.vid = 0;
  if (manual){ S.override = true; S.overrideBlock = scheduledIndex(); } else S.override = false;
  var cols = chan().colors || [], st = $("stage").style;
  if (cols[0]) st.setProperty("--c1", cols[0]); if (cols[1]) st.setProperty("--c2", cols[1]); if (cols[2]) st.setProperty("--c3", cols[2]);
  MC.slides = null;
  if (isYT()) startYouTube(); else startLocal();
  renderTexts(); buildTiles(); toast(T(chan().name)); wakeDock();
}
setInterval(function(){
  var s = scheduledIndex();
  if (S.override && s !== S.overrideBlock) S.override = false;
  if (CONFIG.autoSchedule && !S.override && (s !== S.ch || S.pick)) startChannel(s, false);
}, 30000);

/* ════════════════ sound unlock ════════════════ */
function showHint(){ S.unlocked = false; $("hint").textContent = T(TXT.hint); $("hint").classList.add("show"); }
function setUnlocked(){ S.unlocked = true; $("hint").classList.remove("show"); }
var IN_APP = /[?&]app=1/.test(location.search);   // opened by the Fermata TV app, which is already full screen
var fsTried = IN_APP;
function goFullscreen(){ // only allowed from a key press; the TV browser otherwise keeps its address bar
  if (IN_APP) return;
  fsTried = true;
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
  if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) try { var p = f.call(d); if (p && p["catch"]) p["catch"](function(){}); } catch(e){}
}
function unlock(){
  goFullscreen();
  if (Synth.ctx && Synth.ctx.state !== "running") Synth.ctx.resume();
  if (S.playing && S.mode === "file"){ var p = aud.play(); if (p && p["catch"]) p["catch"](function(){}); }
  if (S.playing && S.mode !== "yt" && (chan().videos||[]).length){ var q = vid.play(); if (q && q["catch"]) q["catch"](function(){}); }
  if (YTP.ready){ YTP.player.unMute(); YTP.player.setVolume(Math.round(CONFIG.volume*100)); if (S.playing && S.mode === "yt") YTP.player.playVideo(); }
  setUnlocked();
}

/* ════════════════ dock, queue, now playing ════════════════ */
var dockT;
function wakeDock(){
  $("dock").classList.add("expanded"); $("queue").classList.add("show");
  clearTimeout(dockT);
  dockT = setTimeout(foldDock, CONFIG.dockIdleSeconds*1000);
}
function foldDock(){ if (!S.playing) return; $("dock").classList.remove("expanded"); $("queue").classList.remove("show"); }
function toggleDock(){ if ($("dock").classList.contains("expanded")){ clearTimeout(dockT); $("dock").classList.remove("expanded"); $("queue").classList.remove("show"); } else wakeDock(); }

function setThumb(src, picto){
  var th = $("thumb"), img = th.querySelector("img");
  if (!img){ img = document.createElement("img"); img.alt = ""; th.innerHTML = ""; th.appendChild(img); }
  if (img.getAttribute("src") !== src) img.src = src;
  img.className = picto ? "picto" : "";
  img.onerror = function(){ if (!picto) setThumb(PICTO, true); else img.style.display = "none"; };
}
function updateNow(){
  var c = chan(), title = "", author = "";
  if (S.mode === "yt"){
    var d = {}; if (YTP.ready) try { d = YTP.player.getVideoData() || {}; } catch(e){}
    var id = d.video_id || (ytItems(c)[0] || {}).id;
    title = d.title || ytTitle(id) || T(TXT.yt); author = d.author || T(TXT.yt);
    if (id) setThumb(ytThumb(id), false); else setThumb(PICTO, true);
  } else if (S.mode === "file" && c.tracks.length){
    var t = c.tracks[S.track % c.tracks.length]; title = t.title; author = t.artist || ""; setThumb(t.cover || PICTO, !t.cover);
  } else { title = T(TXT.ambient); author = T(c.name); setThumb(PICTO, true); }
  $("title").textContent = title; $("author").textContent = author;
  $("dock").classList.toggle("noprog", S.mode === "synth");
}
function renderQueue(){
  var q = $("queue"), items = [], cur = 0, c = chan();
  if (S.mode === "yt"){
    var list = []; if (YTP.ready) try { list = YTP.player.getPlaylist() || []; cur = YTP.player.getPlaylistIndex(); } catch(e){}
    if (!list.length) list = ytItems(c).map(function(v){ return v.id; });
    if (cur < 0) cur = 0;
    for (var i=0;i<Math.min(6,list.length);i++){ var k = (cur+i) % list.length; items.push({ img:ytThumb(list[k]), t:ytTitle(list[k]) || "", cur:i===0 }); }
  } else if (S.mode === "file"){
    var tr = c.tracks; for (var j=0;j<Math.min(6,tr.length);j++){ var m = (S.track+j) % tr.length; items.push({ img:tr[m].cover || "", t:tr[m].title, cur:j===0 }); }
  }
  q.innerHTML = items.length < 2 ? "" : items.map(function(it){
    return '<div class="qItem glass'+(it.cur?' cur':'')+'"><div class="qi">'+(it.img?'<img alt="" src="'+esc(it.img)+'">':'')+'</div><div class="qt">'+esc(it.t)+'</div></div>';
  }).join("");
}
setInterval(function(){ // progress
  var cur = 0, dur = 0, live = false;
  if (S.mode === "yt" && YTP.ready){
    try { cur = YTP.player.getCurrentTime(); dur = YTP.player.getDuration(); var d = YTP.player.getVideoData(); live = d && d.isLive; } catch(e){}
    if (!dur) live = true;
    if (d && d.title && $("title").textContent !== d.title){ updateNow(); renderQueue(); }
  } else if (S.mode === "file"){ cur = aud.currentTime; dur = aud.duration || 0; }
  else live = true;
  $("cur").innerHTML = live ? '<span class="live">'+T(TXT.live)+'</span>' : fmt(cur);
  $("dur").textContent = live ? "" : fmt(dur);
  $("fill").style.width = live ? "100%" : (dur ? Math.min(100, cur/dur*100) : 0)+"%";
  $("fill").style.opacity = live ? .35 : 1;
}, 500);

/* ════════════════ menu card ════════════════ */
var MC = { data:null, slides:null, i:-1, timer:null, visible:false };
function loadMenu(){
  var src = (CONFIG.menu || {}).source; if (!src || !window.fetch) return;
  fetch(src, {cache:"no-store"})
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(html){ // the page keeps its dishes in one "const MENU = {…}" block ending at "END MENU DATA"
      var a = html.indexOf("const MENU ="), b = html.indexOf("END MENU DATA");
      if (a < 0 || b < 0) throw new Error("no MENU block");
      var body = html.slice(a + 12, b); body = body.slice(0, body.lastIndexOf("}") + 1);
      MC.data = (new Function("return (" + body + ");"))(); MC.slides = null;
    })["catch"](function(err){ console.warn("menu:", err); });
}
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function buildSlides(){
  var m = CONFIG.menu || {}, want = chan().menu || m.sections || [], dishes = [], out = [];
  ((MC.data && MC.data.sections) || []).forEach(function(s){
    if (want.length && want.indexOf(s.id) < 0) return;
    (s.items || []).forEach(function(it){ if (it.img) dishes.push({ it:it, sec:s }); });
  });
  (m.items || []).forEach(function(it){ dishes.push({ it:it, sec:{} }); });
  shuffle(dishes);
  for (var i=0;i<dishes.length;i++){ if (i % 5 === 0 && T(CONFIG.special)) out.push({ special:true }); out.push(dishes[i]); }
  if (!out.length && T(CONFIG.special)) out.push({ special:true });
  MC.slides = out; MC.i = -1;
}
function tl(n){ return n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "—"; }
function priceHtml(it, sec){
  var p = it.price; if (p == null || p === "") return "";
  if (p.length === 2){
    var z = it.sizes || sec.sizes || {}; z = z[S.lang] || z.tr || ["", ""];
    return '<span class="pl">'+esc(z[0])+'</span>'+tl(p[0])+'<span class="gap"></span><span class="pl">'+esc(z[1])+'</span>'+tl(p[1])+'<span class="tl">TL</span>';
  }
  return tl(p)+'<span class="tl">TL</span>';
}
function slideData(sl){
  if (!sl) return null;
  if (sl.special){ var sp = CONFIG.special; return { label:T(TXT.special), name:T(sp), line:T(sp.line), price:priceHtml(sp, {}), img:sp.img }; }
  return { label:T(TXT.fromMenu)+(sl.sec.name ? "  ·  "+T(sl.sec.name) : ""), name:T(sl.it.name), line:sl.it.note || T(sl.it.line), price:priceHtml(sl.it, sl.sec), img:sl.it.img };
}
function imgUrl(f){
  if (!f) return "";
  var m = CONFIG.menu, map = m.imgMap || {};
  return (m.imgBase || "") + (map[f] || f.replace(/\.webp$/i, ".jpg"));
}
function renderSlide(){
  var d = slideData((MC.slides || [])[MC.i]); if (!d) return;
  $("mcLabel").textContent = d.label; $("mcName").textContent = d.name;
  $("mcLine").textContent = d.line || ""; $("mcPrice").innerHTML = d.price;
  var src = imgUrl(d.img), box = $("mcPhoto"), img = box.querySelector("img");

}
function nextSlide(fade){
  if (!MC.slides) buildSlides();
  if (!MC.slides.length) return;
  var go = function(){
    MC.i++; if (MC.i >= MC.slides.length){ buildSlides(); MC.i = 0; }   // reshuffle each round

  };
  if (!fade){ go(); return; }
  $("mcText").classList.add("out"); $("mcPhoto").classList.add("out"); setTimeout(go, 750);

setInterval(function(){

function hasLib(){ return !!(CONFIG.youtubeApiKey || (CONFIG.library || []).length); }

/* ════════════════ music library & YouTube search ════════════════ */
// Moods from playlist.json "library", plus "Ara" (search) when playlist.json has a "youtubeApiKey".
// A pick plays at once and holds until the next schedule block.
var KEYROWS = [["a","b","c","ç","d","e","f","g","ğ","h"], ["ı","i","j","k","l","m","n","o","ö","p"],
               ["r","s","ş","t","u","ü","v","y","z","q"], ["w","x","1","2","3","4","5","6","7","8"],
               ["9","0"," ","del","go"]];
var LASTROW_AT = [0, 1, 2, 5, 7];   // visual column where each last-row key starts (space is 3 wide, ⌫ and Ara 2)
var ROWH = 246;                     // card height + bottom margin
var LIB = { open:false, zone:"cats", cat:0, gi:0, kr:0, kc:0, query:"", results:null, busy:false, typed:false };

function libCats(){
  var c = []; if (CONFIG.youtubeApiKey) c.push({ search:true, name:TXT.search });
  return c.concat(CONFIG.library || []);
}
function libItems(){
  var c = libCats()[LIB.cat]; if (!c) return [];
  if (c.search) return LIB.results ? [{ newSearch:true }].concat(LIB.results) : [];
  return (c.items || []).map(function(v){ return typeof v === "string" ? { id:v } : v; });
}
function showingKeys(){ var c = libCats()[LIB.cat] || {}; return !!c.search && (LIB.zone === "keys" || !LIB.results); }
function openLib(){
  if (LIB.cat >= libCats().length) LIB.cat = 0;
  LIB.open = true; LIB.zone = "cats"; LIB.gi = 0;
  $("ui").classList.add("dim"); $("stage").classList.add("overlaid"); renderLib(); $("lib").classList.add("open");
}
function closeLib(){ LIB.open = false; $("lib").classList.remove("open"); $("ui").classList.remove("dim"); $("stage").classList.remove("overlaid"); }
function nowId(){ if (S.mode !== "yt" || !YTP.ready) return ""; try { return (YTP.player.getVideoData() || {}).video_id || ""; } catch(e){ return ""; } }

function renderLib(){
  var cats = libCats();
  $("libTitle").textContent = T(TXT.library);
  $("libKeys").textContent = T(TXT.libKeys);
  $("libCats").innerHTML = cats.map(function(c, i){
    return '<div class="cat'+(i===LIB.cat ? ' sel' : '')+(i===LIB.cat && LIB.zone==="cats" ? ' focus' : '')+'" data-cat="'+i+'">'+
           (c.search ? '⌕&nbsp; ' : '')+esc(T(c.name))+'</div>';
  }).join("");
  var keys = showingKeys();
  $("libGrid").style.display = keys ? "none" : "";
  $("libKb").style.display = keys ? "" : "none";
  if (keys) renderKeys(); else renderGrid();
}
function renderGrid(){
  var items = libItems(), now = nowId(), g = $("libGrid");
  if (!items.length){ g.innerHTML = '<div class="libEmpty">'+esc(T(TXT.noResults))+'</div>'; g.style.transform = ""; return; }
  g.innerHTML = items.map(function(it, i){
    var cls = "card2" + (LIB.zone==="grid" && i===LIB.gi ? " focus" : "") + (it.id && it.id === now ? " now" : "");
    if (it.newSearch) return '<div class="'+cls+'" data-gi="'+i+'"><div class="th kbd">⌕</div><div class="tt">'+esc(T(TXT.newSearch))+
                             (LIB.query ? ' · “'+esc(LIB.query)+'”' : '')+'</div></div>';
    var img = it.thumb || (it.id ? "https://i.ytimg.com/vi/"+it.id+"/mqdefault.jpg" : PICTO);
    return '<div class="'+cls+'" data-gi="'+i+'"><div class="th"><img alt="" src="'+esc(img)+'">'+
           (it.playlist ? '<span class="badge">'+esc(T(TXT.list))+'</span>' : '')+'</div><div class="tt">'+esc(it.title || "")+'</div></div>';
  }).join("");
  var first = LIB.zone === "grid" ? Math.max(0, Math.floor(LIB.gi/4) - 1) : 0;   // keep the focused row in view
  g.style.transform = "translateY("+(-first*ROWH)+"px)";
}
function renderKeys(){
  $("kbInput").innerHTML = LIB.busy ? '<span class="muted">'+esc(T(TXT.searching))+'</span>'
                                    : esc(LIB.query) + '<span class="caret"></span>';
  $("kbKeys").innerHTML = KEYROWS.map(function(row, r){
    return '<div class="kRow">' + row.map(function(k, c){
      var lab = k === " " ? T(TXT.space) : k === "del" ? "⌫" : k === "go" ? T(TXT.search) : k;
      var cls = "key" + (k === " " ? " wide" : "") + (k === "del" || k === "go" ? " mid" : "") + (k === "go" ? " go" : "") +
                (LIB.zone === "keys" && r === LIB.kr && c === LIB.kc ? " focus" : "");
      return '<div class="'+cls+'" data-kr="'+r+'" data-kc="'+c+'">'+esc(lab)+'</div>';
    }).join("") + '</div>';
  }).join("");
}
function vcol(r, c){ return r === KEYROWS.length-1 ? LASTROW_AT[c] : c; }
function colAt(r, x){
  if (r !== KEYROWS.length-1) return Math.min(x, KEYROWS[r].length-1);
  for (var i=LASTROW_AT.length-1;i>=0;i--) if (x >= LASTROW_AT[i]) return i;
  return 0;
}
function pressKey(k){
  if (k === "del") LIB.query = LIB.query.slice(0, -1);
  else if (k === "go"){ doSearch(); return; }
  else if (LIB.query.length < 60) LIB.query += k;
  renderKeys();
}
function decode(s){ var t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
function doSearch(){
  var q = LIB.query.replace(/^\s+|\s+$/g, ""); if (!q || LIB.busy || !window.fetch) return;
  LIB.busy = true; renderKeys();
  var url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=24" +
            "&safeSearch=moderate&regionCode=TR&q="+encodeURIComponent(q)+"&key="+encodeURIComponent(CONFIG.youtubeApiKey);
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) throw new Error(d.error.message);
    LIB.results = (d.items || []).filter(function(x){ return x.id && x.id.videoId; }).map(function(x){
      var th = x.snippet.thumbnails || {};
      return { id:x.id.videoId, title:decode(x.snippet.title), thumb:(th.medium || th["default"] || {}).url };
    });
    LIB.busy = false;
    if ((libCats()[LIB.cat] || {}).search){ LIB.zone = "grid"; LIB.gi = LIB.results.length ? 1 : 0; }   // only if still on Ara
    if (LIB.open) renderLib();
  })["catch"](function(err){
    console.warn("search:", err); LIB.busy = false;
    toast(T(TXT.searchFail) + (err && err.message ? " · " + String(err.message).slice(0, 80) : ""), 6000);
    if (LIB.open) renderLib();
  });
}
function playPick(it){
  var base = CH()[S.ch];
  S.pick = { id:"pick", source:"youtube", name:TXT.pick, colors:base.colors, menu:base.menu, synth:base.synth,
             youtube: it.playlist ? { playlist:it.playlist } : { videos:[{ id:it.id, title:it.title }] } };
  stopAll(); S.override = true; S.overrideBlock = scheduledIndex(); MC.slides = null;
  startYouTube(); renderTexts(); toast(it.title || T(TXT.pick)); setPlaying(true); wakeDock();
}
function libKey(e){ // returns true when the key was used
  var k = e.keyCode, cats = libCats(), items, n;
  if (k === 10009 || k === 27){ closeLib(); return true; }
  if (LIB.zone === "cats"){
    if (k === 38){ if (LIB.cat > 0){ LIB.cat--; LIB.gi = 0; } }
    else if (k === 40){ if (LIB.cat < cats.length-1){ LIB.cat++; LIB.gi = 0; } }
    else if (k === 39 || k === 13){
      if ((cats[LIB.cat] || {}).search && !LIB.results) LIB.zone = "keys";
      else if (libItems().length){ LIB.zone = "grid"; LIB.gi = 0; }
    }
    else if (k === 8){ closeLib(); return true; }
    else return false;
  } else if (LIB.zone === "grid"){
    items = libItems(); n = items.length;
    if (k === 37){ if (LIB.gi % 4 === 0) LIB.zone = "cats"; else LIB.gi--; }
    else if (k === 39){ if (LIB.gi % 4 < 3 && LIB.gi < n-1) LIB.gi++; }
    else if (k === 38){ if (LIB.gi >= 4) LIB.gi -= 4; else if ((cats[LIB.cat] || {}).search) LIB.zone = "keys"; }
    else if (k === 40){ if (LIB.gi + 4 < n) LIB.gi += 4; else if (Math.floor(LIB.gi/4) < Math.floor((n-1)/4)) LIB.gi = n-1; }
    else if (k === 13){
      var it = items[LIB.gi]; if (!it) return true;
      if (it.newSearch) LIB.zone = "keys"; else { closeLib(); playPick(it); return true; }
    }
    else if (k === 8) LIB.zone = "cats";
    else return false;
  } else { // on-screen keyboard
    var row = KEYROWS[LIB.kr];
    if (k >= 37 && k <= 40) LIB.typed = false;   // arrows = remote style; Enter then presses the focused key
    if (k === 37){ if (LIB.kc === 0) LIB.zone = "cats"; else LIB.kc--; }
    else if (k === 39){ if (LIB.kc < row.length-1) LIB.kc++; }
    else if (k === 38 || k === 40){
      var r = LIB.kr + (k === 40 ? 1 : -1);
      if (r >= 0 && r < KEYROWS.length){ LIB.kc = colAt(r, vcol(LIB.kr, LIB.kc)); LIB.kr = r; }
      else if (k === 40 && LIB.results){ LIB.zone = "grid"; LIB.gi = 0; }
    }
    else if (k === 13){ if (LIB.typed) doSearch(); else pressKey(row[LIB.kc]); return true; }   // laptop Enter after typing = search
    else if (k === 8) { pressKey("del"); return true; }
    else if (e.key && e.key.length === 1){
      var ch = e.key === "I" ? "ı" : e.key === "İ" ? "i" : e.key.toLowerCase();   // Turkish dotted/dotless i
      if (!/[0-9a-zçğıöşü ]/.test(ch)) return false;
      LIB.typed = true; pressKey(ch); return true;
    }
    else return false;
  }
  renderLib(); return true;
}

// mouse / touch (laptop, touchscreen): click a mood, a card or a key; click the dark backdrop to close
function libTarget(el){
  for (; el && el !== $("lib"); el = el.parentNode){
    if (!el.getAttribute) continue;
    if (el.getAttribute("data-cat") !== null || el.getAttribute("data-gi") !== null || el.getAttribute("data-kr") !== null) return el;
    if (/\blibSheet\b/.test(el.className)) return el;
  }
  return null;
}
$("lib").addEventListener("click", function(e){
  e.stopPropagation();
  var t = libTarget(e.target), a;
  if (!t){ closeLib(); return; }
  if ((a = t.getAttribute("data-cat")) !== null){ LIB.cat = +a; LIB.gi = 0; LIB.zone = "cats"; libKey({ keyCode:39 }); return; }
  if ((a = t.getAttribute("data-gi")) !== null){ LIB.zone = "grid"; LIB.gi = +a; libKey({ keyCode:13 }); return; }
  if ((a = t.getAttribute("data-kr")) !== null){
    LIB.zone = "keys"; LIB.kr = +a; LIB.kc = +t.getAttribute("data-kc"); LIB.typed = false;
    pressKey(KEYROWS[LIB.kr][LIB.kc]); renderLib();
  }
});

/* ════════════════ remote, keyboard, mouse ════════════════ */
try { if (window.tizen && tizen.tvinputdevice)
  ["MediaPlayPause","MediaPlay","MediaPause","MediaStop","MediaFastForward","MediaRewind","MediaTrackNext","MediaTrackPrevious","ChannelUp","ChannelDown","Info","ColorF1Green"]
    .forEach(function(k){ try { tizen.tvinputdevice.registerKey(k); } catch(e){} }); } catch(e){}

document.addEventListener("keydown", function(e){
  var k = e.keyCode;
  if (!S.unlocked){ unlock(); if (k === 13 || k === 32){ e.preventDefault(); return; } }
  if (LIB.open){ if (libKey(e)) e.preventDefault(); return; }
  if (S.menuOpen){
    if (k===37) moveFocus(-1); else if (k===39) moveFocus(1);
    else if (k===13||k===32) selectFocus();
    else if (k===38||k===40||k===27||k===8||k===10009) closeMenu();
    else return;
    e.preventDefault(); return;
  }
  switch(k){
    case 13: case 32: case 10252:
      if (!fsTried && !(document.fullscreenElement || document.webkitFullscreenElement)){ goFullscreen(); break; }
      setPlaying(!S.playing); break;
    case 37: case 412: case 10232: case 80: step(-1); wakeDock(); break;
    case 39: case 417: case 10233: case 78:  step(1);  wakeDock(); break;
    case 38: openMenu(); break;
    case 404: case 76: if (hasLib()) openLib(); break;   // green button (or L) opens the music library
    case 40: toggleDock(); break;
    case 427: case 33: startChannel(S.ch+1, true); setPlaying(true); break;
    case 428: case 34: startChannel(S.ch-1, true); setPlaying(true); break;
    case 415: setPlaying(true); break;
    case 19: case 413: setPlaying(false); break;
    case 457: case 73: screenInfo(); break;
    default: return;
  }
  e.preventDefault();
});
Array.prototype.forEach.call(document.querySelectorAll("[data-act]"), function(b){
  b.addEventListener("click", function(e){
    e.stopPropagation(); if (!S.unlocked) unlock();
    var a = b.getAttribute("data-act");
    if (a === "play") setPlaying(!S.playing); else step(a === "next" ? 1 : -1);
    wakeDock();
  });
});
$("dock").addEventListener("click", function(e){ e.stopPropagation(); if (!S.unlocked) unlock(); wakeDock(); });
$("stage").addEventListener("click", function(){ if (!S.unlocked){ unlock(); return; } if (LIB.open) closeLib(); else if (S.menuOpen) closeMenu(); else openMenu(); });
var ptrT;
document.addEventListener("mousemove", function(){ document.body.classList.add("pointer"); clearTimeout(ptrT); ptrT = setTimeout(function(){ document.body.classList.remove("pointer"); }, 3000); });

/* ════════════════ clock, burn-in, wake lock, daily reload ════════════════ */
function tickClock(){ var d = new Date(); $("clock").textContent = pad(d.getHours())+":"+pad(d.getMinutes()); }
setInterval(tickClock, 1000); tickClock();
setInterval(function(){ $("ui").style.transform = "translate("+(Math.round(Math.random()*16)-8)+"px,"+(Math.round(Math.random()*12)-6)+"px)"; }, 300000);
function wake(){ try { if (navigator.wakeLock) navigator.wakeLock.request("screen")["catch"](function(){}); } catch(e){} }
document.addEventListener("visibilitychange", function(){ if (!document.hidden) wake(); });
setInterval(function(){ var d = new Date(); if (d.getHours()===7 && d.getMinutes()===55) location.reload(); }, 60000);

/* ════════════════ playlist.json ════════════════ */
var lastJSON = "";
function merge(j){
  ["autoSchedule","tryUnmutedAutoplay","volume","langSeconds","dockIdleSeconds","glass","ytHost","youtubeApiKey","library"].forEach(function(k){ if (j[k] !== undefined) CONFIG[k] = j[k]; });
  if (j.special) CONFIG.special = j.special;
  if (j.menu) for (var mk in j.menu) CONFIG.menu[mk] = j.menu[mk];
  MC.slides = null;
  if (j.cafe) for (var k in j.cafe) CONFIG.cafe[k] = j.cafe[k];
  if (j.channels && j.channels.length){
    var def = CONFIG.channels;
    CONFIG.channels = j.channels.map(function(c, i){
      var b = def.filter(function(d){ return d.id === c.id; })[0] || def[i % def.length];
      return { id:c.id||b.id, source:c.source||"local", name:c.name||b.name, hours:c.hours||b.hours, colors:c.colors||b.colors,
               youtube:c.youtube||null, tracks:c.tracks||[], videos:c.videos||[], synth:c.synth||b.synth, menu:c.menu||null };
    });
    return true;
  }
  return false;
}
function loadPlaylist(cb){
  if (!window.fetch || location.protocol === "file:"){ cb(false); return; }
  fetch("playlist.json?ts="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(txt){ if (!txt || txt === lastJSON){ cb(false); return; } lastJSON = txt; cb(true, merge(JSON.parse(txt))); })
    ["catch"](function(err){ console.warn("playlist.json:", err); cb(false); });
}
setInterval(function(){
  loadPlaylist(function(changed, chChanged){
    if (!changed) return;
    document.body.classList.toggle("lite", CONFIG.glass === "lite");
    qrKey = ""; renderQRs(); renderTexts();
    if (chChanged) startChannel(S.override ? Math.min(S.ch, CH().length-1) : scheduledIndex(), S.override);
  });
}, 300000);

/* ════════════════ boot ════════════════ */
$("playBtn").innerHTML = ICON_PAUSE;
loadPlaylist(function(){
  document.body.classList.toggle("lite", CONFIG.glass === "lite");
  renderQRs(); loadMenu();
  startChannel(scheduledIndex(), false);
  $("toast").classList.remove("show");
  setInterval(swapLang, CONFIG.langSeconds*1000);
  setInterval(rotateQR, CONFIG.langSeconds*2000);
  wake();
});
</script>
